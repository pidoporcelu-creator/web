<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css" crossorigin="anonymous" />

    <!-- Bootstrap CSS (si realmente lo necesitas junto con Tailwind) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="estilos.css" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      /* Maps buscar dirección */

      /* Estilos personalizados para la fuente Inter */
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Asegura que el iframe sea responsive */
      .map-container {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%; /* 16:9 Aspect Ratio (height / width * 100%) */
        height: 400px; /* Altura fija para el mapa */
        overflow: hidden;
        border-radius: 0.5rem; /* Bordes redondeados */
      }
      .map-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 0.5rem; /* Bordes redondeados */
      }
      /* Estilos para el mensaje de error/información */
      .message-box {
        background-color: #ffebee;
        color: #d32f2f;
        border: 1px solid #ef9a9a;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        margin-top: 1rem;
        text-align: center;
        display: none; /* Oculto por defecto */
      }

      /* fin Maps buscar dirección */

      /* Maps estilos*/

      #map {
        height: 400px;
        width: 100%;
        border-radius: 0.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .map-container {
        max-width: 800px;
        background-color: #ffffff;
        padding: 1.5rem;
        border-radius: 0.75rem;
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
      }
      .input-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 1rem;
      }
      .input-group label {
        font-weight: 500;
        color: #4b5563;
        margin-bottom: 0.5rem;
      }
      .input-group input {
        padding: 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 0.375rem;
        font-size: 1rem;
        color: #374151;
      }

      /* Fin Maps estilos*/

      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6; /* Light gray background */
      }
      /* Custom styles for icons in Navbar */
      .icon-container .fas,
      .icon-container .bi {
        color: white; /* Ensure icons are white */
      }
      /* Custom style for the WhatsApp button */
      .btn-wsp {
        position: fixed;
        width: 60px;
        height: 60px;
        line-height: 60px;
        bottom: 40px;
        right: 40px;
        background: #25d366;
        color: #fff;
        border-radius: 50%;
        text-align: center;
        font-size: 30px;
        box-shadow: 0px 1px 10px rgba(0, 0, 0, 0.3);
        z-index: 100;
      }
      .btn-wsp:hover {
        text-decoration: none;
        color: #fff;
        background: #20b05b;
      }
      /* Badge for shopping cart icon */
      .insignia {
        position: absolute;
        top: 0;
        right: 0;
        transform: translate(50%, -50%);
        background-color: #ef4444; /* Red-500 */
        color: white;
        font-size: 0.75rem; /* text-xs */
        font-weight: bold;
        border-radius: 9999px; /* rounded-full */
        padding-left: 0.5rem; /* px-2 */
        padding-right: 0.5rem; /* px-2 */
        padding-top: 0.25rem; /* py-1 */
        padding-bottom: 0.25rem; /* py-1 */
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        height: 20px;
        z-index: 10;
      }
      /* Input styling */
      .input {
        @apply w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500;
      }
      .input.is-invalid {
        @apply border-red-500;
      }
      .input.is-valid {
        @apply border-green-500;
      }
    </style>
  </head>

  <body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Boton whatsap Start -->
    <a href="https://api.whatsapp.com/send?phone=5493446416900" class="btn-wsp" target="_blank">
      <i class="bi bi-whatsapp"></i>
    </a>
    <!-- Boton Whatsapp End -->

    <!-- sticky-top pega la navbar a la parte superior -->
    <nav class="navbar sticky-top navbar-light bg-blue-800 text-white py-3 px-4 shadow-md">
      <div class="container-fluid max-w-7xl mx-auto flex justify-between items-center">
        <!-- Iconos de navegación -->
        <div class="icon-container flex space-x-6 justify-center w-full">
          <a class="fas fa-home text-2xl text-white hover:text-blue-300 transition-colors duration-200" href="/"> </a>

          <a class="fas fa-user text-2xl text-white hover:text-blue-300 transition-colors duration-200" href="/usuario"> </a>

          <a class="fas fa-shopping-cart text-2xl text-white hover:text-blue-300 transition-colors duration-200" href="/carrito"> </a>
          <a class="fas fa-file-alt text-2xl text-white" href="/compras"></a>

          <a class="fas fa-question-circle text-2xl text-white hover:text-blue-300 transition-colors duration-200" href="/preguntas"> </a>
        </div>

        <!-- Offcanvas (menú desplegable, si se usa) -->
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
          <div class="offcanvas-header">
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="">
            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
              <!-- Elementos de menú aquí si se usan -->
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8">


<div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-lg mb-8">

         <button
              id="borrarDatos"

              class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md transition-colors duration-300">
              Borrar datos locales
            </button>
           
</div>



      <!-- Sección Mi Perfil / Login -->
      <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-lg mb-8">
        <h2 class="text-xl md:text-2xl font-semibold text-gray-800 mb-4 pb-2 border-b">Mi Perfil</h2>

        

        <!-- Sección de Login (inicialmente oculta, mostrada por JS si no autenticado) -->
        <section id="login" class="mb-6" style="display: none;">
          <p id="error" class="text-red-500 mb-4"></p>
          <article class="space-y-4">
            <h3 class="text-lg font-semibold text-gray-700">
              Iniciar Sesión / Registrarse con Teléfono, para realizar compras y disfrutar todos los beneficios.
            </h3>
            <div>
              <label for="number" class="block text-sm font-medium text-gray-700 mb-1">Número de Teléfono (sin 0 ni 15):</label>
              <input type="tel" id="number" placeholder="Ej: 3446123456" class="input" />
              <button
                id="numberButton"
                class="mt-2 w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md transition-colors duration-300"
              >
                Enviar Código
              </button>
            </div>
            <div id="recaptcha-container"></div>
            <div>
              <!-- Barra de progreso "Cargando" -->
              <div
                id="loading-bar"
                hidden
                style="
                  position: absolute;
                  top: 50%;
                  left: 50%;
                  transform: translate(-50%, -50%);
                  background-color: rgba(0, 0, 0, 0.7); /* Fondo semi-transparente */
                  color: white;
                  padding: 15px 30px;
                  border-radius: 8px;
                  font-size: 1.2em;
                  font-weight: bold;
                  text-align: center;
                  min-width: 150px;
                  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
                  z-index: 10; /* Asegura que esté por encima de la imagen */
                "
              >
                Enviando<span class="loading-dots"></span> <!-- Span para los puntos animados -->
              </div>
            </div>

            <style>
              /* CSS para la animación de los puntos de carga */
              .loading-dots::after {
                content: ''; /* Contenido inicial vacío */
                animation: dots 1s steps(5, end) infinite; /* Aplica la animación 'dots' */
              }

              @keyframes dots {
                0%,
                20% {
                  content: '.'; /* Un punto */
                }
                40% {
                  content: '..'; /* Dos puntos */
                }
                60%,
                100% {
                  content: '...'; /* Tres puntos */
                }
              }
            </style>

            <div id="code-section" hidden>
              <label for="code" class="block text-sm font-medium text-gray-700 mb-1">Código de Verificación:</label>
              <input type="text" id="code" placeholder="Ingresa el código recibido" class="input" />
              <button
                id="validate"
                class="mt-2 w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-md transition-colors duration-300"
              >
                Validar Código
              </button>
            </div>
          </article>
        </section>

        <!-- Sección de Perfil (inicialmente oculta, mostrada por JS si autenticado) -->
        <section id="profile" class="mb-6" hidden>
          <article class="space-y-4">
            <h3 class="text-lg font-semibold text-gray-700"></h3>
            <div class="flex items-center space-x-4 mb-4">
                <!-- Foto de Perfil -->
           <!-- <img
                id="photo"
                src="https://placehold.co/100x100/cccccc/333333?text=Foto"
                alt="Foto de Perfil"
                class="w-24 h-24 rounded-full object-cover border-2 border-gray-300"
              /> -->
          
               <div class="text-center w-full">
                <p class="text-gray-800 font-semibold text-lg" id="username">Nombre de Usuario</p>
                <p class="text-gray-600 text-sm" id="email">email@ejemplo.com</p>
              </div>
            </div>


            <!-- Google Maps -->
            <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-2xl mx-auto mt-8">
              <h1 class="text-3xl font-bold text-center text-gray-800 mb-6"></h1>

              <div class="mb-6">
                <label for="addressInput" class="block text-gray-700 text-sm font-semibold mb-2"> Ingresa una dirección: </label>
                <input
                  type="text"
                  id="addressInput"
                  placeholder="Ejemplo: urquiza 545, Gualeguaychu, Entre Rios, Argentina"
                  class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 ease-in-out"
                />
              </div>

              <button
                id="searchButton"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-200 ease-in-out transform hover:scale-105 mb-6"
              >
                Buscar en el Mapa
              </button>

              <!-- Contenedor para mensajes de usuario del mapa -->
              <div id="messageBox" class="message-box"></div>

              <div class="map-container">
                <iframe
                  id="googleMapIframe"
                  src=""
                  allowfullscreen=""
                  loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                ></iframe>
              </div>

              <p class="text-sm text-gray-500 mt-4 text-center">
                <strong>Nota:</strong> sé lo más específico posible, calle, número, barrio, localidad
              </p>
            </div>
            <!-- Fin Google Maps -->

            <form id="formulario1" name="loginForm" class="space-y-4">
              <div id="hiddenPrivateInfo3"></div>
              <!-- Contenedor para mensajes de usuario del formulario -->
              <div id="messageBox2" class="message-box">Mensaje de erro</div>

              <button
                id="editar"
                style="display: none;"
                type="button"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition-colors duration-300"
              >
                Guardar Cambios
              </button>
            </form>
            <button
              id="logout"
              class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md transition-colors duration-300"
            >
              Cerrar Sesión
            </button>
          </article>
        </section>
      </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="usuarioCreado.js" type="module"></script>
    <script src="funciones.js" type="module"></script>
    <script src="objetos.js" type="module"></script>
