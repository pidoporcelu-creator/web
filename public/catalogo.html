        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
        }
        /* Custom radio button styling */
        .custom-radio-card input[type="radio"] {
            display: none; /* Hide default radio button */
        }
        .custom-radio-card label {
            display: block;
            padding: 1rem;
            border: 2px solid #e5e7eb; /* Light gray border */
            border-radius: 0.5rem; /* Rounded corners */
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            background-color: #ffffff; /* White background */
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .radio-indicator {
            width: 1rem;
            height: 1rem;
            border: 2px solid #9ca3af; /* Gray border for unchecked */
            border-radius: 50%;
            display: inline-block;
            position: relative;
            transition: all 0.2s ease-in-out;
        }
        .radio-indicator::after {
            content: '';
            width: 0.5rem;
            height: 0.5rem;
            background-color: #ffffff; /* White dot */
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.2s ease-in-out;
        }
        /* Estilos adicionales para texto superpuesto en la imagen */
        .contenedor2 {
            position: relative;
            overflow: hidden; /* Asegura que el contenido no se desborde */
        }
        .contenedor2 img {
            width: 100%;
            height: auto;
            display: block;
        }
        .texto-encima, .centrado, .centrado2 {
            position: absolute;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); /* Sombra para mejor legibilidad */
            font-weight: bold;
            text-align: center;
        }
        .texto-encima { top: 20%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5rem; }
        .centrado { top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2rem; }
        .centrado2 { top: 80%; left: 50%; transform: translate(-50%, -50%); font-size: 2.5rem; }

        /* Estilos específicos para la barra de navegación y sus elementos */
        .icon-container .fas, .icon-container .bi {
            color: white; /* Asegura que los iconos sean blancos */
        }
    </style>

<style>
  /* CSS para la animación de los puntos de carga */
  .loading-dots::after {
    content: ''; /* Contenido inicial vacío */
    animation: dots 1s steps(5, end) infinite; /* Aplica la animación 'dots' */
  }

  @keyframes dots {
    0%, 20% {
      content: '.'; /* Un punto */
    }
    40% {
      content: '..'; /* Dos puntos */
    }
    60%, 100% {
      content: '...'; /* Tres puntos */
    }
  }
