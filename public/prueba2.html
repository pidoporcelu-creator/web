<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Pago Redirección</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f5f5f5;
            padding: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2rem;
            text-align: center;
        }
        #checkout-container {
            width: 100%;
            max-width: 450px;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #checkout-btn {
            background-color: #009ee3;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 158, 227, 0.3);
        }
        #checkout-btn:hover {
            background-color: #0077b3;
            transform: translateY(-2px);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #009ee3;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none; /* Oculto por defecto */
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>Prueba de Integración con Mercado Pago</h1>
    <div id="checkout-container">
        <button id="checkout-btn">Pagar con Mercado Pago</button>
        <div id="loading-spinner" class="loader"></div>
        <p id="status-message" style="display: none; color: #555; margin-top: 10px;">Cargando...</p>
    </div>

    <script>
        const checkoutButton = document.getElementById("checkout-btn");
        const loadingSpinner = document.getElementById("loading-spinner");
        const statusMessage = document.getElementById("status-message");

        checkoutButton.addEventListener("click", async () => {
            // Oculta el botón y muestra el spinner de carga y el mensaje de estado
            checkoutButton.style.display = "none";
            loadingSpinner.style.display = "block";
            statusMessage.style.display = "block";

            const items = [{
                title: "Producto de prueba",
                unit_price: 100,
                quantity: 1,
            }];

            const backUrls = {
                success: "https://www.pidoporcelu.com/pago_exitoso",
                failure: "https://www.pidoporcelu.com/pago_fallido",
                pending: "https://www.pidoporcelu.com/pago_pendiente"
            };

            const data = {
                items: items,
                back_urls: backUrls,
                locale: "es-AR"
            };
            
            try {
                const cloudFunctionUrl = 'https://southamerica-east1-tienda1-81220.cloudfunctions.net/mercadopagoApi/create_preference';
                
                console.log("Iniciando llamada a la Cloud Function...");
                const response = await fetch(cloudFunctionUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                if (!response.ok) {
                    throw new Error(`Error del servidor: ${response.status} - ${response.statusText}`);
                }

                const result = await response.json();
                
                const redirectUrl = result.init_point;

                if (redirectUrl) {
                    console.log("URL de redirección recibida:", redirectUrl);
                    console.log("Redirigiendo al usuario...");
                    window.location.href = redirectUrl;
                } else {
                    console.error("Error: No se recibió una URL de redirección válida (init_point).", result);
                    statusMessage.textContent = "Error al iniciar el pago. Intente de nuevo.";
                    checkoutButton.style.display = "block";
                    loadingSpinner.style.display = "none";
                }
                
            } catch (error) {
                console.error("Error al llamar a la función:", error);
                statusMessage.textContent = "Error de conexión. Intente de nuevo.";
                checkoutButton.style.display = "block";
                loadingSpinner.style.display = "none";
            }
        });
    </script>
</body>
</html>
