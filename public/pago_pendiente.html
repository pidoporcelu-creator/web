<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Pendiente</title>
    <!-- Incluye el CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Contenedor principal de la tarjeta -->
    <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full text-center transform transition-all duration-300 scale-100 hover:scale-105">
        
        <!-- Icono de Pago Pendiente (Reloj) -->
        <div class="mx-auto mb-6 flex items-center justify-center h-20 w-20 rounded-full bg-yellow-100">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-yellow-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
        </div>

        <!-- Título principal -->
        <h1 class="text-3xl font-extrabold text-gray-800 mb-2">Pago Pendiente</h1>
        
        <!-- Mensaje de estado -->
        <p class="text-gray-600 mb-6 leading-relaxed">
            Tu pago está siendo procesado. Recibirás una notificación por correo electrónico tan pronto como se complete la transacción. Por favor, revisa tu bandeja de entrada.
        </p>

        <!-- Botón de acción -->
        <a href="/" class="inline-block w-full bg-yellow-500 text-white font-semibold py-3 px-6 rounded-xl hover:bg-yellow-600 transition-colors duration-300 focus:outline-none focus:ring-4 focus:ring-yellow-300">
            Volver al Inicio
        </a>
    </div>

</body>
</html>
