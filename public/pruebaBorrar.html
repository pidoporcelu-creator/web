<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces con Íconos Mejorados</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        .icon-container {
            display: flex;
            justify-content: center; /* Centrar horizontalmente */
            align-items: center; /* Centrar verticalmente */
            padding: 10px; /* Espacio interior */
            background-color: #f8f9fa; /* Color de fondo */
            border-radius: 10px; /* Bordes redondeados */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Sombra */
        }
        .icon-link {
            text-decoration: none; /* Sin subrayado */
            color: #007bff; /* Color del ícono */
            margin: 0 10px; /* Espacio entre íconos */
            font-size: 24px; /* Tamaño del ícono */
        }
        .navbar-toggler {
            background-color: #007bff; /* Color de fondo */
            border: none; /* Sin borde */
            border-radius: 50%; /* Bordes redondeados */
            padding: 10px; /* Espacio interior */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative; /* Para posicionar la insignia */
        }
        .navbar-toggler:hover {
            background-color: #0056b3; /* Color al pasar el cursor */
        }
        .fas.fa-shopping-cart {
            color: #ffffff; /* Color del ícono */
        }
        .insignia {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: red;
            color: white;
            border-radius: 50%;
            padding: 2px 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="icon-container">
        <a class="fas fa-home fa-2x icon-link" href="/"></a>
        <a class="fas fa-user fa-2x icon-link" href="/usuario"></a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
            <span class="fas fa-shopping-cart fa-2x"></span>
            <span class="insignia">3</span>
        </button>
        
        <a class="fas fa-question-circle fa-2x icon-link" href="/preguntas"></a>
    </div>

    <!-- Scripts de Bootstrap (si es necesario) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js">
