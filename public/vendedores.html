<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autorización de Venta en Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f4f6f9; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .mp-color { background-color: #009ee3; }
        .mp-color-hover { background-color: #008cc9; }
        .mp-color-text { color: #009ee3; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md w-full bg-white p-8 md:p-10 rounded-2xl shadow-2xl text-center">
        
        <h1 class="text-3xl font-extrabold mb-2 text-gray-800">¡Vende con Nosotros!</h1>
        <p class="text-lg text-gray-600 mb-8">Conéctate con Mercado Pago para recibir tus pagos de forma segura.</p>

        <!-- Botón que inicia el flujo de autorización OAuth -->
        <button id="authButton" 
                class="w-full mp-color text-white font-bold py-4 rounded-xl text-xl disabled:opacity-50 disabled:cursor-not-allowed
                       hover:bg-mp-color-hover transition duration-200 ease-in-out shadow-lg transform hover:scale-[1.01] active:scale-[0.99]">
            Vender en Pidoporcelu.com
        </button>

        <div class="mt-8 pt-4 border-t border-gray-200">
            <p class="text-xs text-gray-500">Al hacer clic, serás redirigido a Mercado Pago para autorizar la conexión. <span class="mp-color-text font-semibold">Pidoporcelu.com</span> solo gestionará el cobro de tu comisión.</p>
        </div>
    </div>
    
    <!-- Firebase y Lógica de Autorización -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script> <!-- ✅ CORRECCIÓN: Añadir el SDK de Firestore -->
    <script src="vendedores.js" type="module"></script>
</body>
</html>
